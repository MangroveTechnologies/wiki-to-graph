name: Catalog

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check package and plugin identities
        run: |
          python - <<'PY'
          import json
          import tomllib
          from pathlib import Path

          package = tomllib.loads(Path('pyproject.toml').read_text())['project']
          plugin = json.loads(Path('.claude-plugin/plugin.json').read_text())
          marketplace = json.loads(Path('.claude-plugin/marketplace.json').read_text())
          assert package['name'] == plugin['name'] == marketplace['name'] == 'wiki-to-graph'
          assert package['version'] == plugin['version'] == marketplace['metadata']['version']
          assert package['license'] == plugin['license'] == 'CC-BY-NC-SA-4.0'
          assert marketplace['plugins'] == [{
              'name': plugin['name'],
              'source': './',
              'description': marketplace['plugins'][0]['description'],
          }]
          print(f"Catalog matches {package['name']} {package['version']}")
          PY
